services:
  twingate-connector:
    container_name: twingate-connector
    restart: unless-stopped
    image: twingate/connector:latest
    environment:
      - TWINGATE_NETWORK=YOUR_NETWORK_NAME
      - TWINGATE_ACCESS_TOKEN=YOUR_ACCESS_TOKEN
      - TWINGATE_REFRESH_TOKEN=YOUR_REFRESH_TOKEN
      - TZ=Europe/Vienna

  upsnap:
    container_name: upsnap
    image: ghcr.io/seriousm4x/upsnap:latest
    network_mode: host # Required to send Wake-on-LAN magic packets reliably
    restart: unless-stopped
    environment:
      - TZ=Europe/Vienna
    volumes:
      - ./data:/app/pb_data